# Optional: run only the command-runner image build + backend service.
# The backend prefers Docker for test/command execution and falls back to
# local execution automatically when the daemon is unavailable.
services:
  runner-image:
    image: graphagent-runner:latest
    build:
      context: ./docker
    profiles: ["build"]

  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -r backend/requirements.txt &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port 8010 --app-dir backend"
    ports:
      - "8010:8010"
    environment:
      - GRAPHAGENT_ISOLATION=local   # inside a container, nest no docker
    profiles: ["backend"]
