[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgate"
version = "0.3.1"
description = "Small webhook delivery gateway with attempt ledger and dead-lettering"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools]
packages = ["app", "policies", "reporting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
